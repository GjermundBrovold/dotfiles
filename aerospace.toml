# Reference: https://github.com/i3/i3/blob/next/etc/config

config-version = 2

# In i3, all workspaces are phantom
# I do not know what this means...
persistent-workspaces = []

# Start up
start-at-login = true
after-startup-command = ['exec-and-forget open -n -a LinearMouse.app']

# i3 doesn't have "normalizations" feature that why we disable them here.
# But the feature is very helpful.
# Normalizations eliminate all sorts of weird tree configurations that don't make sense.
# Give normalizations a chance and enable them back.
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Mouse follows focus when focused monitor changes
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
focus-follows-mouse.enabled = true

# misc
auto-reload-config = false

[mode.main.binding]
    # See: https://nikitabobko.github.io/AeroSpace/goodies#open-a-new-window-with-applescript
    cmd-alt-ctrl-enter = 'exec-and-forget open -n -a Ghostty.app'

    # i3 wraps focus by default
    cmd-alt-ctrl-h = 'focus --boundaries-action wrap-around-the-workspace left'
    cmd-alt-ctrl-j = 'focus --boundaries-action wrap-around-the-workspace down'
    cmd-alt-ctrl-k = 'focus --boundaries-action wrap-around-the-workspace up'
    cmd-alt-ctrl-l = 'focus --boundaries-action wrap-around-the-workspace right'

    cmd-alt-ctrl-shift-h = 'move left'
    cmd-alt-ctrl-shift-j = 'move down'
    cmd-alt-ctrl-shift-k = 'move up'
    cmd-alt-ctrl-shift-l = 'move right'

    # Consider using 'join-with' command as a 'split' replacement if you want to enable
    # normalizations
    # cmd-cmd-alt-ctrl-shift--ctrl-shift-h = 'split horizontal'
    # cmd-alt-ctrl-shift-v = 'split vertical'

    cmd-alt-ctrl-f = 'fullscreen'

    cmd-alt-ctrl-p = 'exec-and-forget open -a Screenshot' # Activate apple screenshot tool

    cmd-alt-ctrl-s = 'layout v_accordion' # 'layout stacking' in i3
    cmd-alt-ctrl-w = 'layout h_accordion' # 'layout tabbed' in i3
    cmd-alt-ctrl-e = 'layout tiles horizontal vertical' # 'layout toggle split' in i3

    cmd-alt-ctrl-shift-space = 'layout floating tiling' # 'floating toggle' in i3

    # Not supported, because this command is redundant in AeroSpace mental model.
    # See: https://nikitabobko.github.io/AeroSpace/guide#floating-windows
    #cmd-alt-ctrl-shift-space = 'focus toggle_tiling_floating'

    # `focus parent`/`focus child` are not yet supported, and it's not clear whether they
    # should be supported at all https://github.com/nikitabobko/AeroSpace/issues/5
    # cmd-alt-ctrl-shift-a = 'focus parent'

    cmd-alt-ctrl-1 = 'workspace 1'
    cmd-alt-ctrl-2 = 'workspace 2'
    cmd-alt-ctrl-3 = 'workspace 3'
    cmd-alt-ctrl-4 = 'workspace 4'
    cmd-alt-ctrl-5 = 'workspace 5'
    cmd-alt-ctrl-6 = 'workspace 6'
    cmd-alt-ctrl-7 = 'workspace 7'
    cmd-alt-ctrl-8 = 'workspace 8'
    cmd-alt-ctrl-9 = 'workspace 9'
    cmd-alt-ctrl-0 = 'workspace 10'

    cmd-alt-ctrl-shift-1 = 'move-node-to-workspace 1'
    cmd-alt-ctrl-shift-2 = 'move-node-to-workspace 2'
    cmd-alt-ctrl-shift-3 = 'move-node-to-workspace 3'
    cmd-alt-ctrl-shift-4 = 'move-node-to-workspace 4'
    cmd-alt-ctrl-shift-5 = 'move-node-to-workspace 5'
    cmd-alt-ctrl-shift-6 = 'move-node-to-workspace 6'
    cmd-alt-ctrl-shift-7 = 'move-node-to-workspace 7'
    cmd-alt-ctrl-shift-8 = 'move-node-to-workspace 8'
    cmd-alt-ctrl-shift-9 = 'move-node-to-workspace 9'
    cmd-alt-ctrl-shift-0 = 'move-node-to-workspace 10'

    cmd-alt-ctrl-shift-c = 'reload-config'

    cmd-alt-ctrl-r = 'mode resize'

[mode.resize.binding]
    h = 'resize width -50'
    j = 'resize height +50'
    k = 'resize height -50'
    l = 'resize width +50'
    enter = 'mode main'
    esc = 'mode main'


# Multiple Monitors
[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'secondary'
3 = 'main'
4 = 'main'
5 = 'main'
